name: Java CI Combined

# Push publishes the -SNAPSHOT version already in pom.xml to Sonatype and the Lucee Maven repository.
# A manual run picks a type: release (default) X.Y.Z.N, rc X.Y.Z.N-RC, beta X.Y.Z.N-BETA, alpha X.Y.Z.N-ALPHA
# (N from the -SNAPSHOT in pom.xml), then commits the next -SNAPSHOT. Type "snapshot" only deploys the current snapshot.
# Where each version goes:
#   final (X.Y.Z.N) and -SNAPSHOT: mvn deploy (Maven Central / Sonatype snapshots) plus the Lucee Maven repository
#   -RC, -BETA, -ALPHA:            signed mvn install, then the Lucee Maven repository and a GitHub release
# The shared S3/R2 uploader feeds mvn.lucee-services.com; RC/BETA/ALPHA do not go to Central.
# A push to a branch with a -SNAPSHOT version also commits the next -SNAPSHOT after the deploy,
# so every commit gets its own build number. The bump commit itself does not bump again.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      type:
        description: 'What to publish: release (X.Y.Z.N), rc (-RC), beta (-BETA), alpha (-ALPHA), or snapshot (deploy the current -SNAPSHOT, no bump)'
        type: choice
        options:
          - release
          - rc
          - beta
          - alpha
          - snapshot
        default: release
      lucee-versions:
        description: 'JSON array of Lucee version queries (e.g. ["6.2.5.34/snapshot/jar","6.2.6.0/snapshot/jar"])'
        default: '["6.2/snapshot/jar","7.0/snapshot/jar"]'

# Cancel superseded runs on pull requests and feature branches only, a publishing run is never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lucee-matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.extract-version.outputs.VERSION }}
      release: ${{ steps.extract-version.outputs.RELEASE }}
      next_version: ${{ steps.extract-version.outputs.NEXT_VERSION }}
      publish: ${{ steps.publish.outputs.PUBLISH }}
    steps:
      - name: Set Lucee test matrix
        id: set-matrix
        env:
          INPUT_VERSIONS: ${{ inputs.lucee-versions }}
        run: |
          DEFAULT='["6.2/snapshot/jar","7.0/snapshot/jar"]'
          MATRIX="${INPUT_VERSIONS:-$DEFAULT}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      # Only pushes and manual runs on master/main, a version branch (1.0, 2.0, ...) or release/* may
      # publish (deploy, s3, GitHub release) or commit (bump). Feature and PR branches only build and test.
      - name: Decide whether this run may publish
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PUBLISH=false
          if [[ "$EVENT" == "push" || "$EVENT" == "workflow_dispatch" ]]; then
            BRANCH="${REF#refs/heads/}"
            if [[ "$REF" == refs/heads/* ]] && [[ "$BRANCH" == "master" || "$BRANCH" == "main" || "$BRANCH" =~ ^[0-9]+(\.[0-9]+)*$ || "$BRANCH" == release/* ]]; then
              PUBLISH=true
            fi
          fi
          # a version-bump push must not republish, manual runs stay available for intentional retries
          if [[ "$EVENT" == "push" ]] && [[ "$ACTOR" == "github-actions[bot]" || "$COMMIT_MESSAGE" == "Set version to "* || "$COMMIT_MESSAGE" == *"[skip ci]"* ]]; then
            PUBLISH=false
          fi
          echo "event=${EVENT} ref=${REF} publish=${PUBLISH}"
          echo "PUBLISH=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Extract version number
        id: extract-version
        env:
          # A manual run releases unless the selected type is snapshot. Push and pull_request never do.
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.type || 'snapshot' }}
        run: |
          set -euo pipefail
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r')
          RELEASE=false
          NEXT_VERSION=""
          case "$RELEASE_TYPE" in
            release) SUFFIX="" ;;
            rc) SUFFIX="-RC" ;;
            beta) SUFFIX="-BETA" ;;
            alpha) SUFFIX="-ALPHA" ;;
            snapshot) SUFFIX="none" ;;
            *) echo "::error::unknown release type [${RELEASE_TYPE}]"; exit 1 ;;
          esac
          if [[ "$SUFFIX" != "none" ]]; then
            if [[ "$VERSION" != *-SNAPSHOT ]]; then
              echo "::error::A release run needs a -SNAPSHOT version in pom.xml (found ${VERSION})"
              exit 1
            fi
            RELEASE_VERSION="${VERSION%-SNAPSHOT}"
            if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
              echo "::error::[${RELEASE_VERSION}] is not a 4-part release version"
              exit 1
            fi
            PREFIX="${RELEASE_VERSION%.*}"
            LAST="${RELEASE_VERSION##*.}"
            NEXT_VERSION="${PREFIX}.$((10#$LAST + 1))-SNAPSHOT"
            VERSION="${RELEASE_VERSION}${SUFFIX}"
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}(-RC|-BETA|-ALPHA)?$ ]]; then
              echo "::error::[${VERSION}] is not a valid release version"
              exit 1
            fi
            RELEASE=true
            echo "Release run: publish ${VERSION}, then bump pom.xml to ${NEXT_VERSION}"
          fi
          echo "Using VERSION=${VERSION} RELEASE=${RELEASE} NEXT_VERSION=${NEXT_VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "RELEASE=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "NEXT_VERSION=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

  # Build extension (.lex file)
  build-extension:
    name: Build extension
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      version: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      # A release run builds and tests the version with -SNAPSHOT removed, the same one deploy publishes.
      - name: Set the version for this run
        if: needs.setup.outputs.release == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          new = sys.argv[1]
          path = pathlib.Path("pom.xml")
          text = path.read_text()
          pattern = r"(<artifactId>websocket-extension</artifactId>\s*<version>)[^<]+(</version>)"
          text2, n = re.subn(pattern, lambda m: m.group(1) + new + m.group(2), text, count=1)
          if n != 1:
              raise SystemExit(f"project version was not updated (matches={n})")
          path.write_text(text2)
          print(f"pom.xml version is now {new}")
          PY

      - name: Build extension with Maven
        run: mvn -B -e clean install

      - name: Write build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Extension Version | \`${{ needs.setup.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | \`websocket-extension-${{ needs.setup.outputs.version }}.lex\` |" >> $GITHUB_STEP_SUMMARY

      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: extension-lex
          path: |
            target/*.lex
            !target/*.lite.lex
          retention-days: 1

  # Test against multiple Lucee versions using Lucee Express
  # - 6.2: javax servlet (Tomcat 9)
  # - 7.0: jakarta servlet (Tomcat 11)
  test:
    name: Test - Lucee ${{ matrix.lucee }}
    runs-on: ubuntu-latest
    needs: [setup, build-extension]
    env:
      LUCEE_LOGGING_FORCE_APPENDER: console
      LUCEE_LOGGING_FORCE_LEVEL: info
    strategy:
      fail-fast: false
      matrix:
        lucee: ${{ fromJSON(needs.setup.outputs.lucee-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine Tomcat and Java version
        id: config
        run: |
          MAJOR_MINOR=$(echo "${{ matrix.lucee }}" | grep -oE '^[0-9]+\.[0-9]+')
          case "$MAJOR_MINOR" in
            6.2)
              echo "tomcat=tomcat-9" >> $GITHUB_OUTPUT
              echo "java=11" >> $GITHUB_OUTPUT
              ;;
            7.0|7.1)
              echo "tomcat=tomcat-11" >> $GITHUB_OUTPUT
              echo "java=21" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "ERROR: Unknown Lucee major version: $MAJOR_MINOR"
              exit 1
              ;;
          esac

      - name: Set up JDK ${{ steps.config.outputs.java }}
        uses: actions/setup-java@v5
        with:
          java-version: '${{ steps.config.outputs.java }}'
          distribution: 'temurin'

      - name: Download extension
        uses: actions/download-artifact@v8
        with:
          name: extension-lex
          path: extension

      - name: Download Lucee Express template
        run: |
          EXPRESS_URL=$(curl -s https://update.lucee.org/rest/update/provider/expressTemplates | jq -r '.["${{ steps.config.outputs.tomcat }}"]')
          echo "Downloading Express template from: $EXPRESS_URL"
          curl -L -o express-template.zip "$EXPRESS_URL"
          unzip -q express-template.zip -d lucee-express

      - name: Download Lucee JAR
        id: lucee-jar
        run: |
          LUCEE_URL=$(curl -s "https://update.lucee.org/rest/update/provider/latest/${{ matrix.lucee }}/url" | tr -d '"')
          if [ -z "$LUCEE_URL" ] || [[ "$LUCEE_URL" == *"error"* ]]; then
            echo "ERROR: Could not get Lucee URL from update API for query: ${{ matrix.lucee }}"
            exit 1
          fi
          LUCEE_FILENAME=$(basename "$LUCEE_URL")
          LUCEE_VERSION=$(echo "$LUCEE_FILENAME" | sed 's/lucee-//;s/\.jar//')
          echo "LUCEE_VERSION=$LUCEE_VERSION" >> $GITHUB_OUTPUT
          echo "Downloading Lucee $LUCEE_VERSION from: $LUCEE_URL"
          curl -L -f -o lucee.jar "$LUCEE_URL"
          if ! unzip -t lucee.jar > /dev/null 2>&1; then
            echo "ERROR: Downloaded JAR is corrupt!"
            exit 1
          fi
          rm -f lucee-express/lib/lucee-*.jar
          cp lucee.jar lucee-express/lib/

      - name: Download websocket-client extension
        run: |
          echo "Downloading websocket-client extension..."
          curl -L -o websocket-client.lex "https://ext.lucee.org/websocket-client-extension-2.3.0.9-SNAPSHOT.lex"
          ls -la websocket-client.lex

      - name: Install extensions into Express
        run: |
          mkdir -p lucee-express/lucee-server/deploy
          cp extension/*.lex lucee-express/lucee-server/deploy/
          cp websocket-client.lex lucee-express/lucee-server/deploy/
          echo "Extensions to deploy:"
          ls -la lucee-express/lucee-server/deploy/

      - name: Copy test websocket listeners
        run: |
          # The websocket extension looks for listeners in {lucee-server}/websockets/.
          # Collect listeners from every websockets/ subfolder under tests/ so both
          # top-level (server-only) and tests/integration/ listeners get picked up.
          mkdir -p lucee-express/lucee-server/context/websockets
          find tests -path '*/websockets/*.cfc' -exec cp {} lucee-express/lucee-server/context/websockets/ \;
          echo "WebSocket listeners:"
          ls -la lucee-express/lucee-server/context/websockets/

      - name: Copy tests to webroot
        run: |
          cp -r tests lucee-express/webapps/ROOT/

      - name: Configure Tomcat port
        run: |
          sed -i 's/port="8080"/port="8888"/g' lucee-express/conf/server.xml

      - name: Warmup Lucee Express
        if: false  # disabled to test cold-start without warmup masking race conditions
        run: |
          cd lucee-express
          echo "Running Lucee warmup..."
          export LUCEE_ENABLE_WARMUP=true
          ./bin/catalina.sh run
          echo "Warmup complete"

      - name: Start Lucee Express
        run: |
          cd lucee-express
          echo "Starting Lucee Express..."
          ./bin/catalina.sh start
          echo "Lucee Express started"

      - name: Wait for server to be ready
        run: |
          echo "Waiting for HTTP on port 8888..."
          for i in {1..60}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8888/ | grep -q "200\|302\|404"; then
              echo "HTTP ready after $i seconds"
              break
            fi
            sleep 1
          done

      - name: Debug Lucee config
        if: always()
        run: |
          echo "=== lucee-server/context structure ==="
          find lucee-express/lucee-server/context -type f -name "*.json" -o -name "*.cfc" 2>/dev/null | head -50
          echo ""
          echo "=== websocket.json (if exists) ==="
          cat lucee-express/lucee-server/context/websocket.json 2>/dev/null || echo "Not found"
          echo ""
          echo "=== .CFConfig.json (if exists) ==="
          cat lucee-express/lucee-server/context/.CFConfig.json 2>/dev/null || echo "Not found"
          echo ""
          echo "=== websockets directory ==="
          ls -la lucee-express/lucee-server/context/websockets/ 2>/dev/null || echo "Not found"

      - name: Test websocketInfo()
        id: test-websocket-info
        continue-on-error: true
        run: |
          echo "Testing websocketInfo() on Lucee ${{ matrix.lucee }}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8888/tests/test-websocket-info.cfm)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          # Save output for summary
          echo "$BODY" > /tmp/test-websocket-info.txt
          if [ "$HTTP_CODE" != "200" ] || echo "$BODY" | grep -q "FAILED"; then
            echo "TEST_RESULT=❌ FAILED" >> $GITHUB_OUTPUT
            echo "TEST_FAILED=true" >> $GITHUB_OUTPUT
          else
            echo "Test passed!"
            echo "TEST_RESULT=✅ PASSED" >> $GITHUB_OUTPUT
          fi

      - name: Run integration tests
        id: integration-tests
        continue-on-error: true
        run: |
          echo "Running integration tests on Lucee ${{ matrix.lucee }}..."
          FAILED=false
          RESULTS=""
          for test in test-websocket-client test-lifecycle-callbacks test-return-value-send test-wsclient-broadcast test-wsclients-plural test-binary-send test-close test-session-access test-onfirstopen-rearm test-onopen-async test-request-timeout test-identity-scope test-stale-timeout; do
            echo ""
            echo "=============================================="
            echo "Running ${test}"
            echo "=============================================="
            RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8888/tests/integration/${test}.cfm)
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "$BODY"
            echo "$BODY" > /tmp/${test}.txt
            if [ "$HTTP_CODE" != "200" ] || echo "$BODY" | grep -q "FAILED"; then
              echo "${test}: ❌ FAILED"
              RESULTS="${RESULTS}${test}: ❌ FAILED\n"
              FAILED=true
            else
              echo "${test}: ✅ PASSED"
              RESULTS="${RESULTS}${test}: ✅ PASSED\n"
            fi
          done
          echo -e "$RESULTS" > /tmp/integration-results.txt
          if [ "$FAILED" = "true" ]; then
            echo "INTEGRATION_FAILED=true" >> $GITHUB_OUTPUT
            echo "INTEGRATION_RESULT=❌ Some tests failed" >> $GITHUB_OUTPUT
          else
            echo "INTEGRATION_RESULT=✅ All tests passed" >> $GITHUB_OUTPUT
          fi

      - name: Dump WebSocket event logs
        if: always()
        run: |
          # Event logs are written to the system temp dir by file-based test listeners
          # (see LifecycleListener.cfc). Dumped on always() so failing tests have
          # visible debug info in the CI log.
          echo "=== WebSocket Test Event Logs ==="
          found=false
          for f in /tmp/ws-*.log; do
            [ -f "$f" ] || continue
            found=true
            echo ""
            echo "--- $f ---"
            cat "$f"
          done
          if [ "$found" = "false" ]; then
            echo "(no event logs found — no test wrote to /tmp/ws-*.log)"
          fi

      - name: Test idleTimeout (LDEV-6219)
        id: test-idle-timeout
        continue-on-error: true
        run: |
          echo "Testing idleTimeout on Lucee ${{ matrix.lucee }}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8888/tests/test-idle-timeout.cfm)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          echo "$BODY" > /tmp/test-idle-timeout.txt
          if [ "$HTTP_CODE" != "200" ] || echo "$BODY" | grep -q "FAILED"; then
            echo "IDLE_TEST_RESULT=❌ FAILED" >> $GITHUB_OUTPUT
            echo "IDLE_TEST_FAILED=true" >> $GITHUB_OUTPUT
          else
            echo "Test passed!"
            echo "IDLE_TEST_RESULT=✅ PASSED" >> $GITHUB_OUTPUT
          fi

      - name: Test endpoint registration (LDEV-6972)
        id: test-endpoint-registration
        continue-on-error: true
        run: |
          echo "Testing endpoint registration on Lucee ${{ matrix.lucee }}..."
          FAILED=false
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8888/tests/test-endpoint-registration.cfm)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          echo "$BODY" > /tmp/test-endpoint-registration.txt
          if [ "$HTTP_CODE" != "200" ] || echo "$BODY" | grep -q "FAILED"; then
            FAILED=true
          fi
          # the endpoint must have been added exactly once at startup, a second addEndpoint() makes Tomcat fail the deployment
          if grep -q "Multiple Endpoints may not be deployed" lucee-express/logs/catalina.out 2>/dev/null; then
            echo "FAILED: endpoint was registered more than once at startup" | tee -a /tmp/test-endpoint-registration.txt
            grep -n -B2 -A6 "Multiple Endpoints may not be deployed" lucee-express/logs/catalina.out | tee -a /tmp/test-endpoint-registration.txt
            FAILED=true
          fi
          if [ "$FAILED" = "true" ]; then
            echo "ENDPOINT_TEST_RESULT=❌ FAILED" >> $GITHUB_OUTPUT
            echo "ENDPOINT_TEST_FAILED=true" >> $GITHUB_OUTPUT
          else
            echo "Test passed!"
            echo "ENDPOINT_TEST_RESULT=✅ PASSED" >> $GITHUB_OUTPUT
          fi

      - name: Write test summary
        if: always()
        run: |
          echo "## Test Results - Lucee ${{ matrix.lucee }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lucee Version | \`${{ steps.lucee-jar.outputs.LUCEE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tomcat | ${{ steps.config.outputs.tomcat }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | ${{ steps.config.outputs.java }} |" >> $GITHUB_STEP_SUMMARY
          echo "| websocketInfo() | ${{ steps.test-websocket-info.outputs.TEST_RESULT || '⚠️ Unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ steps.integration-tests.outputs.INTEGRATION_RESULT || '⚠️ Unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| idleTimeout (LDEV-6219) | ${{ steps.test-idle-timeout.outputs.IDLE_TEST_RESULT || '⚠️ Unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint registration (LDEV-6972) | ${{ steps.test-endpoint-registration.outputs.ENDPOINT_TEST_RESULT || '⚠️ Unknown' }} |" >> $GITHUB_STEP_SUMMARY

          # Include failure details in summary
          if [ "${{ steps.test-websocket-info.outputs.TEST_FAILED }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### websocketInfo() Test Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/test-websocket-info.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.integration-tests.outputs.INTEGRATION_FAILED }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Integration Tests" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/integration-results.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            for test in test-websocket-client test-lifecycle-callbacks test-return-value-send test-wsclient-broadcast test-wsclients-plural test-binary-send test-close test-session-access test-onfirstopen-rearm test-onopen-async test-request-timeout test-identity-scope test-stale-timeout; do
              if [ -f /tmp/${test}.txt ] && grep -q "FAILED" /tmp/${test}.txt; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "#### ${test}" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat /tmp/${test}.txt >> $GITHUB_STEP_SUMMARY || true
                echo '```' >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi

          if [ "${{ steps.test-idle-timeout.outputs.IDLE_TEST_FAILED }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### idleTimeout Test Output (LDEV-6219)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/test-idle-timeout.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.test-endpoint-registration.outputs.ENDPOINT_TEST_FAILED }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Endpoint registration Test Output (LDEV-6972)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/test-endpoint-registration.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if tests failed
        if: steps.test-websocket-info.outputs.TEST_FAILED == 'true' || steps.integration-tests.outputs.INTEGRATION_FAILED == 'true' || steps.test-idle-timeout.outputs.IDLE_TEST_FAILED == 'true' || steps.test-endpoint-registration.outputs.ENDPOINT_TEST_FAILED == 'true'
        run: exit 1

      - name: Stop Lucee Express
        if: always()
        run: |
          cd lucee-express
          ./bin/shutdown.sh || true

      - name: Show catalina.out
        if: always()
        run: |
          echo "=== catalina.out ==="
          cat lucee-express/logs/catalina.out || echo "No catalina.out found"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lucee-logs-${{ steps.lucee-jar.outputs.LUCEE_VERSION }}
          path: |
            lucee-express/logs/
            lucee-express/lucee-server/context/logs/

  test-config-override:
    name: Test - Config override (${{ matrix.override-mode }})
    runs-on: ubuntu-latest
    needs: [setup, build-extension]
    strategy:
      fail-fast: false
      matrix:
        include:
          - override-mode: env-var
            env-var-value: /tmp/ws-alt-config.json
            java-opts: ""
          - override-mode: jvm-arg
            env-var-value: ""
            java-opts: "-Dlucee.websocket.config=/tmp/ws-alt-config.json"
    env:
      LUCEE_LOGGING_FORCE_APPENDER: console
      LUCEE_LOGGING_FORCE_LEVEL: info
      LUCEE_WEBSOCKET_CONFIG: ${{ matrix.env-var-value }}
      LUCEE_ADMIN_PASSWORD: testadmin
      JAVA_OPTS: ${{ matrix.java-opts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download extension
        uses: actions/download-artifact@v8
        with:
          name: extension-lex
          path: extension

      - name: Download Lucee Express template (tomcat-11)
        run: |
          EXPRESS_URL=$(curl -s https://update.lucee.org/rest/update/provider/expressTemplates | jq -r '.["tomcat-11"]')
          curl -L -o express-template.zip "$EXPRESS_URL"
          unzip -q express-template.zip -d lucee-express

      - name: Download Lucee JAR (7.0 snapshot)
        id: lucee-jar
        run: |
          LUCEE_URL=$(curl -s "https://update.lucee.org/rest/update/provider/latest/7.0/snapshot/jar/url" | tr -d '"')
          LUCEE_VERSION=$(basename "$LUCEE_URL" | sed 's/lucee-//;s/\.jar//')
          echo "LUCEE_VERSION=$LUCEE_VERSION" >> $GITHUB_OUTPUT
          curl -L -f -o lucee.jar "$LUCEE_URL"
          rm -f lucee-express/lib/lucee-*.jar
          cp lucee.jar lucee-express/lib/

      - name: Download websocket-client extension
        run: curl -L -o websocket-client.lex "https://ext.lucee.org/websocket-client-extension-2.3.0.9-SNAPSHOT.lex"

      - name: Install extensions into Express
        run: |
          mkdir -p lucee-express/lucee-server/deploy
          cp extension/*.lex         lucee-express/lucee-server/deploy/
          cp websocket-client.lex    lucee-express/lucee-server/deploy/

      - name: Set up ALT config + listener path (no default listeners copied)
        run: |
          # Alt config file — the LUCEE_WEBSOCKET_CONFIG env var points the extension here
          echo '{"directory":"/tmp/ws-alt-listeners/","requestTimeout":50,"idleTimeout":300}' > /tmp/ws-alt-config.json
          # Alt listener directory — extension will look here (not in default {lucee-config}/websockets/)
          mkdir -p /tmp/ws-alt-listeners
          cp tests/websockets/TestListener.cfc /tmp/ws-alt-listeners/
          echo "Alt config:"; cat /tmp/ws-alt-config.json
          echo "Alt listeners:"; ls -la /tmp/ws-alt-listeners/

      - name: Copy tests to webroot
        run: cp -r tests lucee-express/webapps/ROOT/

      - name: Configure Tomcat port
        run: sed -i 's/port="8080"/port="8888"/g' lucee-express/conf/server.xml

      - name: Resolve built .lex absolute path
        run: |
          LEX_FILE=$(ls $GITHUB_WORKSPACE/extension/*.lex | head -1)
          echo "WS_EXT_LEX_PATH=$LEX_FILE" >> $GITHUB_ENV
          echo "Resolved .lex to: $LEX_FILE"

      - name: Start Lucee Express (override mode = ${{ matrix.override-mode }})
        run: cd lucee-express && ./bin/catalina.sh start

      - name: Wait for server
        run: |
          for i in {1..60}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8888/ | grep -q "200\|302\|404"; then
              echo "HTTP ready after $i seconds"; break
            fi
            sleep 1
          done

      - name: Run config-override test
        id: config-override-test
        continue-on-error: true
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8888/tests/integration/test-config-override.cfm)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          if [ "$HTTP_CODE" != "200" ] || echo "$BODY" | grep -q "FAILED"; then
            echo "CONFIG_OVERRIDE_FAILED=true" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # Reflection / Lucee-restart scenario — TEMPORARILY DISABLED.
      #
      # The post-restart path hits a real bug: after cfadmin action="restart",
      # the new CFMLEngine's extension classloader can't load
      # JakartaWebSocketEndpoint.class — `WebSocketEndpointFactory.scanWebContexts`
      # and `registerEndpoint` both fail with "unable to load class path".
      # The reflection fallback never gets a chance to patch the old static slot
      # because the new classes themselves aren't loadable.
      #
      # The test CFMs (trigger-lucee-restart.cfm, test-reflection-restart.cfm)
      # and this workflow block are kept in place for when the underlying bug
      # is fixed — just re-enable the steps below.
      #
      # See LDEV-6221 and the companion catalina.out output in the earlier CI
      # run logs for the stack trace.
      # ------------------------------------------------------------------
      # - name: Trigger Lucee engine restart (LDEV-6221 scenario)
      #   id: restart-trigger
      #   continue-on-error: true
      #   run: |
      #     RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8888/tests/integration/trigger-lucee-restart.cfm)
      #     HTTP_CODE=$(echo "$RESPONSE" | tail -1)
      #     BODY=$(echo "$RESPONSE" | sed '$d')
      #     echo "$BODY"
      #     if [ "$HTTP_CODE" != "200" ] || echo "$BODY" | grep -q "FAILED"; then
      #       echo "RESTART_TRIGGER_FAILED=true" >> $GITHUB_OUTPUT
      #     fi
      #
      # - name: Wait for Lucee to come back online
      #   run: |
      #     for i in {1..60}; do
      #       if curl -s -o /dev/null -w "%{http_code}" http://localhost:8888/tests/test-websocket-info.cfm | grep -q "200"; then
      #         echo "Lucee responding after $i attempts"
      #         break
      #       fi
      #       sleep 1
      #     done
      #
      # - name: Run post-restart reflection round-trip
      #   id: reflection-test
      #   continue-on-error: true
      #   run: |
      #     RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8888/tests/integration/test-reflection-restart.cfm)
      #     HTTP_CODE=$(echo "$RESPONSE" | tail -1)
      #     BODY=$(echo "$RESPONSE" | sed '$d')
      #     echo "$BODY"
      #     if [ "$HTTP_CODE" != "200" ] || echo "$BODY" | grep -q "FAILED"; then
      #       echo "REFLECTION_FAILED=true" >> $GITHUB_OUTPUT
      #     fi
      #
      # - name: Verify reflection warning in catalina.out
      #   id: reflection-log-check
      #   continue-on-error: true
      #   run: |
      #     if grep -q "calling \[.*\] via reflection" lucee-express/logs/catalina.out; then
      #       echo "Reflection warning found — hot re-install exercised the fallback path"
      #       grep "calling \[.*\] via reflection" lucee-express/logs/catalina.out
      #     else
      #       echo "REFLECTION_LOG_MISSING=true" >> $GITHUB_OUTPUT
      #       echo "Reflection warning NOT found in catalina.out — hot re-install did not hit the fallback path"
      #     fi

      - name: Dump WebSocket event logs
        if: always()
        run: |
          for f in /tmp/ws-*.log; do
            [ -f "$f" ] || continue
            echo "--- $f ---"; cat "$f"
          done || echo "(no event logs found)"

      - name: Stop Lucee Express
        if: always()
        run: cd lucee-express && ./bin/shutdown.sh || true

      - name: Show catalina.out
        if: always()
        run: cat lucee-express/logs/catalina.out || echo "No catalina.out found"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lucee-logs-config-override-${{ matrix.override-mode }}-${{ steps.lucee-jar.outputs.LUCEE_VERSION }}
          path: |
            lucee-express/logs/
            lucee-express/lucee-server/context/logs/

      - name: Fail if any sub-test failed
        if: steps.config-override-test.outputs.CONFIG_OVERRIDE_FAILED == 'true'
        run: exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build-extension, test, test-config-override]
    # pull requests (often from forks) get no secrets, so they only build and test
    if: always() && needs.test.result == 'success' && needs.test-config-override.result == 'success' && needs.setup.outputs.publish == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Install Maven 3.9.16
        # ubuntu-latest moved to Maven 3.10.0 (Oct 2026), which stages maven-metadata-local.xml next to the
        # artifact; Central then rejects the bundle ("Bundle has content that does NOT have a .pom file").
        # Pin 3.9.16 for the deploy. Retry downloads and fall back to the permanent archive if the CDN is unavailable.
        run: |
          downloaded=false
          for url in \
            https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          do
            if curl --fail --location --connect-timeout 20 --max-time 60 \
              --retry 2 --retry-delay 2 --retry-all-errors \
              --output /tmp/maven.tar.gz "$url"; then
              downloaded=true
              break
            fi
          done
          if [ "$downloaded" != true ]; then
            echo "Failed to download Maven 3.9.16 from all configured URLs" >&2
            exit 1
          fi
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  /tmp/maven.tar.gz" | sha512sum -c -
          tar -xzf /tmp/maven.tar.gz -C /tmp
          echo "/tmp/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          /tmp/apache-maven-3.9.16/bin/mvn -v

      - name: Set the version for this run
        if: needs.setup.outputs.release == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          new = sys.argv[1]
          path = pathlib.Path("pom.xml")
          text = path.read_text()
          pattern = r"(<artifactId>websocket-extension</artifactId>\s*<version>)[^<]+(</version>)"
          text2, n = re.subn(pattern, lambda m: m.group(1) + new + m.group(2), text, count=1)
          if n != 1:
              raise SystemExit(f"project version was not updated (matches={n})")
          path.write_text(text2)
          print(f"pom.xml version is now {new}")
          PY

      - name: Build and Deploy with Maven
        id: deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot ${VERSION} on ${{ github.event_name }} -------";
            echo "DEPLOY_TYPE=Snapshot" >> $GITHUB_OUTPUT
            mvn -B -e clean deploy --settings maven-settings.xml
          elif [[ "$VERSION" =~ -(RC|BETA|ALPHA)$ ]]; then
            # Pre-releases go to the Lucee Maven repository and GitHub releases, never Maven Central.
            echo "------- Maven Install (signed) ${VERSION} on ${{ github.event_name }}, Lucee Maven repository and GitHub release -------";
            echo "DEPLOY_TYPE=Pre-release" >> $GITHUB_OUTPUT
            mvn -B -e clean install -DperformRelease=true --settings maven-settings.xml
          else
            echo "------- Maven Deploy release ${VERSION} on ${{ github.event_name }} -------";
            echo "DEPLOY_TYPE=Release" >> $GITHUB_OUTPUT
            mvn -B -e clean deploy -DperformRelease=true --settings maven-settings.xml
          fi

      # fail before either publisher can receive an incomplete build
      - name: Verify Lucee Maven repository and GitHub release files
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          # this extension has no lite build, the full .lex and the flattened POM are required
          for FILE in "target/websocket-extension-${VERSION}.lex" .flattened-pom.xml; do
            if [[ ! -s "$FILE" ]]; then
              echo "::error::Missing or empty published build file: $FILE"
              exit 1
            fi
          done
          python3 - "$VERSION" <<'PY'
          import sys, xml.etree.ElementTree as ET
          pom = ET.parse(".flattened-pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          expected = {"groupId": "org.lucee", "artifactId": "websocket-extension", "version": sys.argv[1]}
          for field, value in expected.items():
              actual = pom.findtext(f"m:{field}", namespaces=ns)
              if actual != value:
                  raise SystemExit(f"Flattened POM {field}: expected {value}, found {actual}")
          PY

      - name: Write deploy summary
        if: success()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.setup.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Type | ${{ steps.deploy.outputs.DEPLOY_TYPE }} |" >> $GITHUB_STEP_SUMMARY

      # Both publishers use this exact build: full/lite .lex and the generated POM.
      - name: Upload artifact for Lucee Maven repository and GitHub release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: websocket-s3
          if-no-files-found: error
          include-hidden-files: true
          path: |
            target/*.lex
            .flattened-pom.xml

  # LDEV-6683: publish every final, ALPHA, BETA and RC build as a GitHub release with its .lex files attached,
  # so ext.lucee.org can redirect downloads to GitHub releases (LDEV-6511). -SNAPSHOT builds get no GitHub release.
  # Separate job, so a failure here never blocks the Maven Central or Lucee Maven repository upload.
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup, deploy]
    if: >-
      always() && needs.deploy.result == 'success'
      && needs.setup.outputs.publish == 'true'
      && !endsWith(needs.setup.outputs.version, '-SNAPSHOT')
    permissions:
      # create the release (and its tag) and upload its assets
      contents: write
    steps:
      # the same files the S3 job uploads (built by the deploy job with the published version)
      - name: Download published extension
        uses: actions/download-artifact@v4
        with:
          name: websocket-s3
          path: release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-files -type f \( -name "*-${VERSION}.lex" -o -name "*-${VERSION}.lite.lex" \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no .lex files for $VERSION found"; find release-files -type f; exit 1
          fi
          printf 'Asset: %s\n' "${FILES[@]}"

          # the release tag is the exact published version (3.1.0.0 or 3.1.0.0-RC), created on this commit
          # if it does not exist yet. ALPHA/BETA/RC are pre-releases and never "latest".
          if [[ "$VERSION" == *-* ]]; then
            PRE=(--prerelease --latest=false)
          elif [ "$IS_DEFAULT_BRANCH" == "true" ]; then
            PRE=(--latest)
          else
            PRE=(--latest=false)
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - uploading assets again"
            gh release upload "$VERSION" "${FILES[@]}" --clobber
          else
            echo "Creating release $VERSION ${PRE[*]} on $GITHUB_SHA"
            gh release create "$VERSION" "${FILES[@]}" "${PRE[@]}" --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "Build $VERSION from commit $GITHUB_SHA, published by $RUN_URL"
          fi

  # upload the published build to the Maven folders (mvn.lucee-services.com), LDEV-6568.
  # Cut-off rules (SNAPSHOTs stop on 2027-03-01) live in the called workflow.
  # Finals and SNAPSHOTs are also on Central / Sonatype; RC, BETA and ALPHA also get GitHub releases.
  # secrets: inherit passes the org secrets S3_ACCESS_ID_DOWNLOAD and S3_SECRET_KEY_DOWNLOAD.
  # The called workflow warns and skips when those secrets are not available to this repo.
  s3:
    needs: [setup, deploy]
    if: always() && needs.deploy.result == 'success' && needs.setup.outputs.publish == 'true'
    uses: lucee/lucee/.github/workflows/extension-s3-upload.yml@7.1
    with:
      artifact-name: websocket-s3
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # After deploy AND the Lucee Maven repository upload succeed, commit the next -SNAPSHOT.
  # Do not consume a version when the upload job fails, is cancelled, or is skipped.
  # No loop: the push uses the workflow token, which does not start another workflow run,
  # and runs started by github-actions[bot] or with the bump message are skipped anyway.
  bump:
    runs-on: ubuntu-latest
    needs: [setup, deploy, s3]
    if: >-
      always() && needs.deploy.result == 'success'
      && needs.setup.outputs.publish == 'true'
      && needs.s3.result == 'success'
      && (needs.setup.outputs.release == 'true'
        || (github.event_name == 'push'
          && startsWith(github.ref, 'refs/heads/')
          && endsWith(needs.setup.outputs.version, '-SNAPSHOT')
          && github.actor != 'github-actions[bot]'
          && !startsWith(github.event.head_commit.message, 'Set version to ')
          && !contains(github.event.head_commit.message, '[skip ci]')))
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bump to the next SNAPSHOT
        env:
          NEXT_VERSION: ${{ needs.setup.outputs.next_version }}
          DEPLOYED_VERSION: ${{ needs.setup.outputs.version }}
          IS_RELEASE: ${{ needs.setup.outputs.release }}
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" != "true" ]]; then
            # push: bump from the version on the branch tip, only if nobody bumped it since this deploy
            CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r')
            if [[ "$CURRENT" != "$DEPLOYED_VERSION" ]]; then
              echo "Branch is at ${CURRENT}, deployed ${DEPLOYED_VERSION}; already bumped, nothing to do"
              exit 0
            fi
            BASE="${CURRENT%-SNAPSHOT}"
            if ! [[ "$BASE" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
              echo "::warning::[${CURRENT}] is not a 4-part SNAPSHOT version, not bumping"
              exit 0
            fi
            NEXT_VERSION="${BASE%.*}.$((10#${BASE##*.} + 1))-SNAPSHOT"
            echo "Push run: bump pom.xml from ${CURRENT} to ${NEXT_VERSION}"
          fi
          if [[ -z "$NEXT_VERSION" ]]; then
            echo "::error::next version was not resolved"
            exit 1
          fi
          python3 - "$NEXT_VERSION" <<'PY'
          import pathlib, re, sys
          new = sys.argv[1]
          path = pathlib.Path("pom.xml")
          text = path.read_text()
          pattern = r"(<artifactId>websocket-extension</artifactId>\s*<version>)[^<]+(</version>)"
          text2, n = re.subn(pattern, lambda m: m.group(1) + new + m.group(2), text, count=1)
          if n != 1:
              raise SystemExit(f"project version was not updated (matches={n})")
          path.write_text(text2)
          print(f"pom.xml version is now {new}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if git diff --cached --quiet; then
            echo "pom.xml already at ${NEXT_VERSION}"
            exit 0
          fi
          git commit -m "Set version to ${NEXT_VERSION}"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
